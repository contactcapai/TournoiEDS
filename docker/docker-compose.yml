# docker-compose.yml — Stack PROD Tournoi TFT EDS + Vitrine EDS
#
# USAGE — depuis le dossier docker/ :
#   docker compose up -d
#
# UN SEUL fichier, UN SEUL Postgres. La stack Supabase self-hosted a ete RETIREE le
# 2026-07-29 (revision d'architecture) : la vitrine n'en consommait aucun service, elle
# parle a Postgres nu via Drizzle. Voir docs/PASSATION.md et, cote planification,
# docs/planning-artifacts/sprint-change-proposal-2026-07-29-simplification-supabase.md
#
# Secrets compose (Traefik, PG tournoi) : docker/.env (copier docker/.env.example)
# Secrets vitrine : apps/vitrine/.env.prod (copier apps/vitrine/.env.prod.example)

services:
  traefik:
    # 🔴 VERSION EXACTE, PAS le tag flottant `v3` (durcissement Story 7.1). La 7.1 introduit
    # le PREMIER motif « deux routeurs sur le meme Host, middleware asymetrique » (n8n : webhook
    # sans basic auth / UI avec) — motif de la classe GHSA-gm3x-23wp-hc2c (bypass de middleware
    # par normalisation de chemin, corrige en v3.6.3). La 3.6.14 deployee est saine (verifie :
    # un chemin encode via le routeur webhook ne rend que le SPA public, ni API ni ecriture).
    # Epingler EVITE qu'un `docker compose pull` futur reintroduise un statut inconnu en silence
    # — meme discipline « montee = geste + re-verif » que le pin n8n ci-dessous.
    image: traefik:v3.6.14
    container_name: tournoi-tft-traefik
    restart: unless-stopped
    command:
      # Providers
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=tournoi-net
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirection globale HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Resolver Let's Encrypt (HTTP-01, CA server bascule staging<->prod via env)
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caServer=${LETSENCRYPT_CA_SERVER}
      # Logs / accesslog minimalistes (pas de dashboard, pas d'API exposee)
      - --log.level=INFO
      - --accesslog=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks:
      - tournoi-net

  postgres:
    image: postgres:17-alpine
    container_name: tournoi-tft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mot de passe du role applicatif de la VITRINE, consomme par initdb/01-vitrine.sh
      # au PREMIER demarrage seulement (volume vide).
      VITRINE_DB_PASSWORD: ${VITRINE_DB_PASSWORD}
    volumes:
      - tournoi-pg-data:/var/lib/postgresql/data
      # Cree la base et le role `vitrine`, cloisonnes de la base du tournoi.
      # ⚠️ IGNORE si le volume est deja initialise (cas du VPS) : jouer les ordres
      # a la main, procedure dans docs/PASSATION.md.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tournoi-net



  # ─────────────────────────────────────────────────
  # Vitrine EDS — Site vitrine Next.js (esportdessacres.fr)
  # NEXT_PUBLIC_SITE_URL fige au build (build-arg, inlineee dans le bundle).
  # DATABASE_URL arrives au runtime via env_file (server-only, jamais dans l'image).
  # La base Postgres est la base `vitrine` du conteneur tournoi-tft-postgres,
  # mutualise depuis la revision d'architecture du 2026-07-29.
  # ─────────────────────────────────────────────────
  vitrine:
    build:
      context: ..
      dockerfile: apps/vitrine/Dockerfile
      args:
        # NEXT_PUBLIC_SITE_URL est inlineee dans le bundle Next au build.
        # Ne pas passer DATABASE_URL ici (server-only, contiendrait des identifiants).
        # ⚠️ Pilotee par VITRINE_HOST (docker/.env) : changer d'hote EXIGE un rebuild
        # (`docker compose build vitrine`), un simple `up -d` ne suffit pas.
        # ⚠️ Son effet sur le HTML rendu est NUL aujourd'hui (elle n'alimente que
        # `metadataBase`, sans canonical ni og:image a resoudre) — cf. dette R22 et
        # le commentaire detaille de docker/.env.example.
        NEXT_PUBLIC_SITE_URL: https://${VITRINE_HOST}
    container_name: eds-vitrine
    restart: unless-stopped
    env_file:
      # DATABASE_URL et vars runtime de la vitrine (jamais committees, cf. .gitignore).
      - ../apps/vitrine/.env.prod
    environment:
      # 🔴 AUTH_URL — AJOUTEE PAR LA STORY 7.4, SUR UN DEFAUT MESURE SUR LE STAGING REEL.
      # Sans elle, Auth.js construisait son `redirect_uri` avec `https://0.0.0.0:3000`
      # (l'adresse d'ECOUTE du conteneur, HOSTNAME/PORT du Dockerfile) au lieu de l'hote
      # public — donc `invalid_redirect_uri` cote Discord, et un back-office ou PERSONNE
      # ne peut se connecter. Mesure du 2026-08-08 sur staging.
      #
      # ⚠️ `trustHost: true` (fige dans src/server/auth/config.ts) NE SUFFIT PAS : il
      # AUTORISE l'inference de l'hote, il ne la rend pas juste. Temoin de controle pris
      # sur la MEME requete : le proxy Next, lui, redirigeait bien vers
      # https://staging.esportdessacres.fr/admin/login — Traefik transmet donc l'hote
      # correctement, et le defaut est PROPRE a la derivation d'URL d'Auth.js.
      # La note de la Story 6.1 (« on ne confie pas cette valeur a un oubli de variable
      # sur le VPS ») avait RAISON SUR LE RISQUE — l'echec ne survient qu'en production —
      # et TORT SUR LE REMEDE.
      #
      # 🔴 DERIVEE DE VITRINE_HOST, JAMAIS ECRITE A LA MAIN : elle ne peut donc pas
      # diverger de la regle Traefik ci-dessous. La bascule de la Story 7.5 reste
      # « deux lignes de docker/.env + un rebuild ». Contrairement au build-arg
      # NEXT_PUBLIC_SITE_URL, celle-ci est lue au RUNTIME : un `up -d` suffit.
      - AUTH_URL=https://${VITRINE_HOST}
    # Pas de depends_on sur postgres : la connexion Drizzle est PARESSEUSE (premier
    # appel a la DB, pas au demarrage du conteneur), donc la vitrine sert ses pages
    # statiques meme si la base n'est pas encore healthy. Acquis de la Story 1.7,
    # conserve tel quel par la sortie de Supabase.
    volumes:
      # Medias de la galerie (Story 4.3) + televersements du back-office (Epic 6).
      # Remplace Supabase Storage. Sauvegarde par docker/backup-medias.sh.
      #
      # 🔴 CHEMIN CORRIGE PAR LA STORY 4.3 — il valait `/app/apps/vitrine/medias`, et
      # c'etait FAUX : le Dockerfile fixe `WORKDIR /repo` et lance
      # `node apps/vitrine/server.js`, donc l'application vit sous /repo/apps/vitrine/.
      # Le montage designait un chemin sans aucun rapport avec l'arborescence reelle.
      # ⚠️ Le mode de defaillance etait le pire possible : Docker CREE le point de
      # montage, `up` reussit, le healthcheck passe, backup-medias.sh sauvegarde un
      # volume qui existe — et l'application ne trouve aucun fichier. Rien ne le
      # signale avant qu'un visiteur ne voie une galerie de 404 (famille de la dette R21).
      # ⚠️ DOIT rester identique a MEDIA_DIR dans apps/vitrine/.env.prod : c'est cette
      # variable que lit src/server/medias, et c'est ce qui rend l'accord VERIFIABLE
      # au lieu de reposer sur deux chemins en dur qui se desynchroniseront.
      - eds-medias:/repo/apps/vitrine/medias
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tournoi-net"
      # Hote pilote par VITRINE_HOST (docker/.env) : staging.esportdessacres.fr le temps
      # de la validation (Story 7.4), esportdessacres.fr a la bascule (Story 7.5). Rien a
      # defaire dans le code versionne le jour J — deux lignes de docker/.env + un rebuild.
      # ⚠️ Ce commentaire a nomme `preprod.esportdessacres.fr` jusqu'au 2026-08-08 : ce
      # nom n'a jamais eu de DNS (mesure : NXDOMAIN). Voir docker/.env.example.
      # ══════════════════════════════════════════════════════════════════════════════
      # LES DEUX HOTES HERITES DE L'ANCIENNE APP — STORY 10.7
      # ══════════════════════════════════════════════════════════════════════════════
      #
      # 🔴 ILS ETAIENT PORTES PAR LE SERVICE `frontend`, QUI N'EXISTE PLUS. La redirection de
      # `tournoi.esportdessacres.fr` vers /tournois existe depuis la Story 9.4 ; ce que la 10.7
      # retire, c'est l'EXEMPTION qui envoyait `/overlay`, `/assets` et `/favicon.svg` vers
      # l'ancien SPA. Un routeur ne peut pas vivre sans service : les deux hotes sont donc
      # portes ici, par la vitrine.
      #
      # ⚠️ LES URLS D'OVERLAY NE SONT PAS EQUIVALENTES, ET C'EST POURQUOI TOUT VA VERS
      # /tournois : l'ancienne (`/overlay`) vise un tournoi IMPLICITE, la nouvelle
      # (`/overlay/<slug>`) en NOMME un. Rediriger vers un slug serait INVENTER lequel.
      # ⚠️ L'exemption etait en `PathRegexp` insensible a la casse — une subtilite payee le
      # 2026-08-14 (`PathPrefix` laissait `/OVERLAY` partir en redirection alors que le SPA le
      # servait). Elle disparait avec elle.
      #
      # ⚠️ `api-tournoi` REDIRIGE AUSSI, bien que c'ait ete une API : plus aucun client ne
      # l'appelle, et un humain qui tape l'URL atterrit quelque part de sense plutot que sur
      # une erreur Traefik.
      #
      # 🔴 LA CIBLE SE DERIVE DE `VITRINE_HOST`, ELLE N'EST JAMAIS ECRITE EN DUR — regle de la
      # 9.4, conservee mot pour mot : `https://esportdessacres.fr/tournois` rend un 404
      # Hostinger tant que la bascule DNS (7.5) n'est pas faite. Derivee, elle vise staging
      # aujourd'hui et l'apex TOUT SEUL apres la bascule. Rien a repasser le jour J.
      # 🔴 TEMPORAIRE ET SURTOUT PAS PERMANENT (`permanent=false`) : un 301 se met en cache
      # SANS EXPIRATION cote navigateur, et ne se retire plus.
      # ⚠️ AUCUN `$` DANS CES REGEX (pas d'ancre de fin) : docker compose tenterait de
      # l'interpoler comme une variable. Sans ancre, le motif couvre deja tout l'hote.
      - "traefik.http.routers.tournoi-legacy.rule=Host(`tournoi.esportdessacres.fr`) || Host(`api-tournoi.esportdessacres.fr`)"
      - "traefik.http.routers.tournoi-legacy.entrypoints=websecure"
      - "traefik.http.routers.tournoi-legacy.tls=true"
      - "traefik.http.routers.tournoi-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tournoi-legacy.middlewares=tournoi-legacy-redirect"
      - "traefik.http.routers.tournoi-legacy.service=eds-vitrine"
      - "traefik.http.middlewares.tournoi-legacy-redirect.redirectregex.regex=^https://[^/]+/(.*)"
      - "traefik.http.middlewares.tournoi-legacy-redirect.redirectregex.replacement=https://${VITRINE_HOST}/tournois"
      - "traefik.http.middlewares.tournoi-legacy-redirect.redirectregex.permanent=false"

      - "traefik.http.routers.eds-vitrine.rule=Host(`${VITRINE_HOST}`)"
      - "traefik.http.routers.eds-vitrine.entrypoints=websecure"
      - "traefik.http.routers.eds-vitrine.tls=true"
      - "traefik.http.routers.eds-vitrine.tls.certresolver=letsencrypt"
      - "traefik.http.routers.eds-vitrine.middlewares=eds-vitrine-robots"
      # X-Robots-Tag pilote par VITRINE_ROBOTS. Sur le staging : "noindex, nofollow" —
      # sans lui, Google indexe le staging et il entre en duplicate content avec le
      # site public. En production : VARIABLE VIDE — Traefik retire alors l'en-tete
      # (une valeur vide dans customresponseheaders SUPPRIME l'en-tete, elle ne le pose
      # pas a vide), ce qui rend la bascule inoffensive pour le referencement.
      - "traefik.http.middlewares.eds-vitrine-robots.headers.customresponseheaders.X-Robots-Tag=${VITRINE_ROBOTS}"
      - "traefik.http.services.eds-vitrine.loadbalancer.server.port=3000"
    networks:
      - tournoi-net

  # ─────────────────────────────────────────────────
  # n8n d'Esport des Sacres — publication reseaux (Story 7.1, dette R42 ①)
  # Instance PROPRE A L'ASSO (decision de Brice, 2026-08-07) : les jetons d'API des
  # comptes sociaux ne vivent pas sur l'instance d'un prestataire.
  #
  # 🔴 VERSION EPINGLEE, PAS `latest`. Historique du choix 2.33.7 (2026-08-07) :
  # d'abord 2.20.9 (version d'export du workflow), montee en 2.33.7 (stable du jour)
  # en cours d'instruction d'un 403 persistant — ⚠️ dont la CAUSE REELLE s'est averee
  # etre l'option `Ignore Bots` du nœud Webhook (elle rejette l'UA `node` de la
  # vitrine en 403 identique a un mauvais jeton), PAS la version. Les deux versions
  # se comportent pareil ; on RESTE sur 2.33.7 (stable, migrations DB deja jouees —
  # elles sont a sens unique, revenir en arriere exigerait une restauration de volume).
  # L'instruction complete : apps/vitrine/n8n/README.md, piege ②.
  # L'import n8n drope des parametres en silence (00 reference/pieges/webhook-n8n.md) —
  # changer de version d'image est un GESTE : sauvegarde du volume AVANT (backup-n8n.sh),
  # puis re-verification nœud par nœud et re-sonde du webhook derriere.
  #
  # 🔴 DEUX ROUTEURS TRAEFIK, ET C'EST UNE FRONTIERE DE SECURITE :
  #   - eds-n8n-webhook (Host + PathPrefix(`/webhook`)) : SANS basic auth — les webhooks
  #     portent LEUR PROPRE authentification (Header Auth, x-eds-webhook-token). Le
  #     prefixe couvre /webhook/ (prod) ET /webhook-test/ (bouton « Listen for test event »).
  #   - eds-n8n-ui (Host seul) : DERRIERE le basic auth Traefik DES LA PREMIERE SECONDE.
  #     Sans lui, la fenetre entre `up -d` et la creation du compte owner n8n serait
  #     ouverte au premier visiteur venu — c'est exactement le « jamais expose sans
  #     authentification, meme transitoirement » de l'AC1. Le basic auth RESTE ensuite,
  #     en couche supplementaire devant le login n8n.
  #   Priorite : Traefik departage par LONGUEUR de regle — la regle webhook, plus longue,
  #   gagne sur /webhook* sans priorite explicite.
  #
  # ⚠️ N8N_ENCRYPTION_KEY (docker/.env) chiffre les credentials en base. La sauvegarde
  # n8n-*.tar.gz est MORTE sans cette cle : docker/.env ne part PAS dans les sauvegardes
  # (c'est voulu, ce sont des secrets) — le conserver ailleurs fait partie de la
  # passation (docs/PASSATION.md §3). Ne JAMAIS changer la cle apres coup.
  # ─────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.33.7
    container_name: eds-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      # URL publique annoncee aux nœuds Webhook (sans elle, n8n afficherait des URLs
      # en http://localhost:5678 inutilisables).
      - WEBHOOK_URL=https://${N8N_HOST}/
      # 🔴 OBLIGATOIRE, echec BRUYANT si absente (garde `:?`). Sans elle, n8n AUTO-GENERE une
      # cle et la range DANS le volume sauvegarde (log « No encryption key found - Auto-
      # generating »), healthcheck vert — puis « Mismatching encryption keys » au redeploiement
      # suivant, apres que des credentials aient pu etre crees avec la cle fantome (mesure 7.1).
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant dans docker/.env (voir .env.example) — ne JAMAIS laisser n8n auto-generer sa cle}
      # Fuseau des declencheurs et de l'UI — la regle de date du workflow est
      # « ISO avec offset de Paris, jamais un Z » (apps/vitrine/n8n/README.md).
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      # Base SQLite + config n8n. Sauvegarde par docker/backup-n8n.sh (4e cible).
      - n8n-data:/home/node/.n8n
    healthcheck:
      # Pas de wget/curl garanti dans l'image : node est toujours la.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tournoi-net"
      # Routeur 1 — webhooks (auth propre : Header Auth du nœud, jamais de basic auth
      # ici, sinon le POST du site serait refuse avant d'atteindre n8n).
      - "traefik.http.routers.eds-n8n-webhook.rule=Host(`${N8N_HOST}`) && PathPrefix(`/webhook`)"
      - "traefik.http.routers.eds-n8n-webhook.entrypoints=websecure"
      - "traefik.http.routers.eds-n8n-webhook.tls=true"
      - "traefik.http.routers.eds-n8n-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.eds-n8n-webhook.service=eds-n8n"
      # Routeur 2 — UI et API, derriere le basic auth Traefik (N8N_BASICAUTH,
      # docker/.env — hash htpasswd, QUOTES SIMPLES obligatoires, cf. .env.example).
      - "traefik.http.routers.eds-n8n-ui.rule=Host(`${N8N_HOST}`)"
      - "traefik.http.routers.eds-n8n-ui.entrypoints=websecure"
      - "traefik.http.routers.eds-n8n-ui.tls=true"
      - "traefik.http.routers.eds-n8n-ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.eds-n8n-ui.middlewares=eds-n8n-basicauth"
      - "traefik.http.routers.eds-n8n-ui.service=eds-n8n"
      - "traefik.http.middlewares.eds-n8n-basicauth.basicauth.users=${N8N_BASICAUTH}"
      - "traefik.http.services.eds-n8n.loadbalancer.server.port=5678"
    networks:
      - tournoi-net

networks:
  tournoi-net:
    name: tournoi-net
    driver: bridge

volumes:
  tournoi-pg-data:
  traefik-acme:
  # Medias de la vitrine (photos de la galerie, Epic 4/6) — ex-Supabase Storage.
  eds-medias:
  # Donnees n8n (SQLite : workflows, credentials chiffres, executions) — Story 7.1.
  # Sauvegarde par docker/backup-n8n.sh ; restauration : PASSATION.md §3.
  n8n-data:
